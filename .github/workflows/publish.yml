name: Publish to PyPI

# Builds the sdist + wheel on every push/PR (so breakage shows up early) and
# publishes to PyPI when a version tag (v1.2.3) is pushed, via PyPI Trusted
# Publishing (no API token: register this repo + workflow + `pypi` environment
# on pypi.org under the project's "Publishing" settings first).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          [ "$pkg" = "$tag" ] || { echo "pyproject version $pkg != tag $tag"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The stubs follow the upstream `pybricks` stub style (docstring-only
      # bodies), so they are checked the way users see them: installed, and
      # exercised by type-checking the examples against them.
      - name: mypy the examples against the installed stubs
        run: |
          python -m pip install --upgrade mypy .
          mypy --ignore-missing-imports --follow-imports=silent examples

  publish:
    needs: [build, typecheck]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
